name: Rust CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: Clippy
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # rustfmt runs on nightly because rustfmt.toml sets `imports_granularity`, which is a
      # nightly-only option. Stable rustfmt warns that it cannot apply it and then passes regardless,
      # so a stable-only check enforces nothing about imports while appearing to. Installed before the
      # stable toolchain so stable remains the default and clippy is unaffected.
      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --all --all-targets --all-features -- -D warnings

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check
